name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 secret is not set. See RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}"
          } > keystore.properties

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease

      - name: Rename APK to include tag
        id: rename
        run: |
          src=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$src" ]; then
            echo "::error::release APK not found at $src"
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi
          dest="bluecheckers-${GITHUB_REF_NAME}.apk"
          cp "$src" "$dest"
          echo "apk=$dest" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Blue Checkers ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.rename.outputs.apk }}

      - name: Clean up keystore
        if: always()
        run: |
          rm -f keystore.properties "$RUNNER_TEMP/release.jks" || true
